version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: control_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: control_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/control_db
      - JWT_SECRET=super_secret_key_in_docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: control_web
    ports:
      - "3000:8000"
    depends_on:
      - api

volumes:
  postgres_data:
  media_data: